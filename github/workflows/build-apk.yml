name: Compilar APK de depuración

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Pruebas unitarias (ordenación, exclusiones, aleatoriedad, filtros...)
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        continue-on-error: true      # un fallo de pruebas no impide obtener el APK

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tulip-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore
